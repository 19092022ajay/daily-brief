<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Brief · {{DATE}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FFFFFF;
      --ink: #0A0A0A;
      --body: #262626;
      --muted: #525252;
      --rule: #E2E5EA;
      --breaking: #D90429;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      -webkit-font-smoothing: antialiased;
      line-height: 1.6;
    }

    .shell {
      max-width: 1120px;
      margin: 0 auto;
      padding: 36px 32px 84px;
    }

    .masthead {
      border-top: 4px solid var(--ink);
      border-bottom: 1px solid var(--ink);
      padding: 16px 0 14px;
      margin-bottom: 40px;
    }

    .masthead h1 {
      margin: 0;
      font-size: clamp(22px, 2.8vw, 30px);
      font-weight: 800;
      letter-spacing: -0.025em;
      text-transform: uppercase;
      line-height: 1;
    }

    .poster {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 5;
      overflow: hidden;
      background: #0A0C10;
    }

    .poster.g1{background:linear-gradient(160deg,#1b2a41,#0A0C10)}.poster.g2{background:linear-gradient(160deg,#3a1c1c,#0A0C10)}.poster.g3{background:linear-gradient(160deg,#14332b,#0A0C10)}.poster.g4{background:linear-gradient(160deg,#2b2347,#0A0C10)}.poster.g5{background:linear-gradient(160deg,#3b2f14,#0A0C10)}.poster.g6{background:linear-gradient(160deg,#10333f,#0A0C10)}
    .poster img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .story-link:hover .poster img { transform: scale(1.03); }

    .poster-scrim {
      position: absolute;
      inset: 0;
      background: radial-gradient(
        ellipse 82% 62% at 14% 16%,
        rgba(0, 0, 0, 0.44) 0%,
        rgba(0, 0, 0, 0.14) 55%,
        rgba(0, 0, 0, 0) 100%
      );
      pointer-events: none;
    }

    .poster-top {
      position: absolute;
      top: 6.5%;
      left: 6%;
      right: 16%;
      z-index: 2;
    }

    .kicker {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      padding: 4px 9px;
      margin-bottom: 10px;
      line-height: 1;
    }

    .kicker-breaking { background: var(--breaking); color: #FFFFFF; }
    .kicker-normal { background: #0A0A0A; color: #FFFFFF; }

    .poster-headline {
      margin: 0;
      color: #FFFFFF;
      font-size: clamp(23px, 2.5vw, 32px);
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: -0.04em;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.36);
    }

    .poster-brand {
      position: absolute;
      right: 5.5%;
      bottom: 4.5%;
      z-index: 2;
      color: #FFFFFF;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.025em;
      text-shadow: 0 1px 10px rgba(0, 0, 0, 0.55);
    }

    .split-row {
      display: grid;
      grid-template-columns: 400px 1fr;
      gap: 44px;
      align-items: center;
      padding-bottom: 44px;
      margin-bottom: 44px;
      border-bottom: 1px solid var(--rule);
      text-decoration: none;
      color: inherit;
    }

    .split-row.closing {
      padding-top: 44px;
      padding-bottom: 24px;
      margin-bottom: 0;
      border-top: 1px solid var(--rule);
    }

    .split-index {
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .split-index.breaking { color: var(--breaking); }

    .split-copy-box {
      border-left: 3px solid var(--ink);
      padding-left: 22px;
    }

    .split-copy-box.breaking { border-left-color: var(--breaking); }

    .pure-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      column-gap: 44px;
      row-gap: 44px;
      margin-bottom: 44px;
    }

    .pure-entry {
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
    }

    .pure-body {
      padding-top: 18px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .story-copy {
      margin: 0;
      font-size: 15px;
      line-height: 1.62;
      color: var(--body);
    }

    .story-foot {
      margin-top: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12.5px;
    }

    .story-source { font-weight: 600; color: var(--muted); }
    .story-cta { font-weight: 700; color: var(--ink); }
    .story-link:hover .story-cta { text-decoration: underline; text-underline-offset: 3px; }

    @media (max-width: 767px) {
      .shell { padding: 0 0 56px; }
      .masthead { padding: 16px 20px 14px; margin-bottom: 0; }
      .split-row, .split-row.closing {
        grid-template-columns: 1fr;
        gap: 0;
        padding: 0 0 28px;
        margin-bottom: 0;
        border-top: 0;
        border-bottom: 1px solid var(--rule);
      }
      .split-right, .pure-body { padding: 18px 20px 0; }
      .split-index { display: none; }
      .split-copy-box { border-left: 0; padding-left: 0; }
      .pure-grid { grid-template-columns: 1fr; row-gap: 0; margin-bottom: 0; }
      .pure-entry { padding-bottom: 28px; border-bottom: 1px solid var(--rule); }
      .poster-headline { font-size: 27px; }
    }
  </style>
</head>
<body>
  <main class="shell"><header class="masthead"><h1>{{DATE}}</h1></header>
{{CONTENT}}
</main></body></html>
